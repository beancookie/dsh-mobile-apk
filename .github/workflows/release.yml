name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 运行时快照不入库（约 110MB×2）：从本仓库最新已发布 Release 取双 ABI 快照。
      # 快照放入项目根 snapshot/（stageSnapshot 按 -PsnapshotAbi 取用 + ELF 架构门禁）。
      - name: Resolve runtime snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snapshot
          SNAP_DIR=/tmp/snap; mkdir -p "$SNAP_DIR"
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "fetching snapshots from release: ${LATEST}"
          gh release download "${LATEST}" --pattern 'snapshot-*.tar.xz' --dir "$SNAP_DIR" --clobber || true
          cp "$SNAP_DIR"/snapshot-arm64.tar.xz snapshot/ 2>/dev/null || true
          cp "$SNAP_DIR"/snapshot-x86_64.tar.xz snapshot/ 2>/dev/null || true
          test -f snapshot/snapshot-arm64.tar.xz
          test -f snapshot/snapshot-x86_64.tar.xz

      # 签名密钥（可选）：仓库 secrets 注入；未配置则产出未签名 APK。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          fi

      - name: Build release APKs (dual ABI)
        env:
          KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for abi in arm64 x86_64; do
            ./gradlew assembleRelease -PsnapshotAbi=$abi --no-daemon
            cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "/tmp/dsh-mobile-apk-${TAG}-${abi}.apk"
          done
          ls -l /tmp/dsh-mobile-apk-${TAG}-*.apk

      - name: Stage release assets + MANIFEST
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE=/tmp/assets; mkdir -p "$STAGE"
          cp /tmp/dsh-mobile-apk-${TAG}-arm64.apk "$STAGE/"
          cp /tmp/dsh-mobile-apk-${TAG}-x86_64.apk "$STAGE/"
          cp /tmp/snap/snapshot-arm64.tar.xz "$STAGE/snapshot-arm64.tar.xz"
          cp /tmp/snap/snapshot-x86_64.tar.xz "$STAGE/snapshot-x86_64.tar.xz"
          # MANIFEST：sha256 + 分类路径 + 字节数
          : > "$STAGE/MANIFEST.txt"
          for f in "$STAGE"/*; do
            name=$(basename "$f")
            if [[ "$name" == dsh-mobile-apk* ]]; then cat="apk"
            elif [[ "$name" == snapshot* ]]; then cat="snapshot"
            else continue; fi
            hash=$(sha256sum "$f" | awk '{print $1}')
            size=$(stat -c%s "$f")
            echo "${hash}  ${cat}/${name}  ${size}" >> "$STAGE/MANIFEST.txt"
          done
          sort -o "$STAGE/MANIFEST.txt" "$STAGE/MANIFEST.txt"
          # 生成发布说明：本 tag 与上一 tag 之间的提交
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          { echo "# ${TAG} 发布说明"; echo; echo "## 提交"; git log "${PREV:-HEAD}..${TAG}" --oneline --no-merges 2>/dev/null | sed 's/^/- /' || true; } > "$STAGE/notes.md"
          ls -la "$STAGE"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE=/tmp/assets
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$TAG" "$STAGE"/*.apk "$STAGE"/*.tar.xz "$STAGE"/MANIFEST.txt "$STAGE"/notes.md --clobber
          else
            gh release create "$TAG" "$STAGE"/*.apk "$STAGE"/*.tar.xz "$STAGE"/MANIFEST.txt "$STAGE"/notes.md \
              --title "dsh-mobile ${TAG}" --notes-file "$STAGE/notes.md"
          fi
